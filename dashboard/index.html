  <script>
    function get(k, d) { try { return JSON.parse(localStorage.getItem(k) || JSON.stringify(d)); } catch { return d; } }
    function set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
    function fmtDate(ts) { return new Date(ts).toLocaleDateString('ja-JP', { year:'numeric', month:'short', day:'numeric'}); }

    const favs = get('sf_favorites', []);
    const reads = get('sf_read_articles', []);
    const lastBbq = get('sf_last_bbq_date', null);
    const visits = get('sf_visit_count', 0);
    const deviation = parseInt(localStorage.getItem('sf_level_deviation') || '0', 10);
    const daysSinceBbq = lastBbq ? Math.floor((Date.now() - lastBbq) / 86400000) : null;

    // Stats
    document.getElementById('dbStats').innerHTML = `
      <div class="db-stat">
        <div class="db-stat-num">${favs.length}</div>
        <div class="db-stat-label">お気に入り</div>
      </div>
      <div class="db-stat">
        <div class="db-stat-num">${reads.length}</div>
        <div class="db-stat-label">読了記事</div>
      </div>
      <div class="db-stat">
        <div class="db-stat-num">${deviation || '?'}</div>
        <div class="db-stat-label">BBQ偏差値</div>
      </div>
      <div class="db-stat">
        <div class="db-stat-num">${daysSinceBbq != null ? daysSinceBbq : '?'}</div>
        <div class="db-stat-label">最後のBBQから</div>
      </div>
    `;

    function renderList(elId, items, lsKey) {
      const el = document.getElementById(elId);
      if (!items.length) {
        el.innerHTML = `<div class="db-empty">まだありません。<a href="../journal/">FIRESIDEで記事を読む</a></div>`;
        return;
      }
      el.innerHTML = items.map((it, i) => `
        <div class="db-item" data-i="${i}">
          <a href="${it.url}" style="flex:1;text-decoration:none;color:inherit;">
            <span class="db-item-title">${(it.title || '無題').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c])}</span>
          </a>
          <span class="db-item-date">${fmtDate(it.date)}</span>
          <button class="db-item-remove" data-key="${lsKey}" data-i="${i}" aria-label="削除">✕</button>
        </div>
      `).join('');
    }

    renderList('favList', favs, 'sf_favorites');
    renderList('readList', reads, 'sf_read_articles');

    document.querySelectorAll('.db-item-remove').forEach(b => {
      b.addEventListener('click', e => {
        const key = e.target.dataset.key;
        const idx = parseInt(e.target.dataset.i);
        const arr = get(key, []);
        arr.splice(idx, 1);
        set(key, arr);
        location.reload();
      });
    });
  </script>
