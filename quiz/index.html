  <script>
    const QUESTIONS = [
      {q: 'BBQで「焼肉スタイル」と「アメリカンBBQ」の違いを説明できる？', yes: 8, no: 0},
      {q: '蓋付きグリル（Weber Kettle等）を持っている、または使ったことがある？', yes: 10, no: 0},
      {q: '肉の中心温度を測る温度計を持っている？', yes: 8, no: 0},
      {q: 'ブリスケットやプルドポークを焼いたことがある？', yes: 12, no: 0},
      {q: 'リバースシア法を知っている、または実践したことがある？', yes: 10, no: 0},
      {q: 'BBQラブ（ドライスパイス）を使ったことがある？', yes: 6, no: 0},
      {q: 'テキサスクラッチ（肉をホイル/ペーパーで包む技法）を知っている？', yes: 10, no: 0},
      {q: 'BBQを10時間以上連続でしたことがある？', yes: 12, no: 0},
      {q: 'インダイレクト（間接火）で焼く意味を理解している？', yes: 8, no: 0},
      {q: '炭の種類（黒炭/白炭/オガ炭等）の違いを知っている？', yes: 6, no: 0},
    ];

    const LEVELS = [
      {min: 0, max: 19, label: 'BBQビギナー', deviation: 35, desc: 'まだまだ未開拓のフィールド！世界には「アメリカンBBQ」という別の体系があって、味も体験もまったく違います。まずは「焼肉スタイルから次の一歩」がおすすめ。', recommends: [
        ['焼肉スタイルのBBQに飽きたら', 'PHILOSOPHY', '../journal/articles/from-yakiniku.html'],
        ['BBQ用語12選 — 海外動画が3倍楽しくなる', 'PHILOSOPHY', '../journal/articles/bbq-yougo.html'],
        ['BBQプランナーで5分計画', 'TOOL', '../planner/'],
      ]},
      {min: 20, max: 39, label: 'BBQライダー', deviation: 50, desc: 'BBQの基礎は押さえています。次は「ロー&スロー」の世界に足を踏み入れる時。一度プルドポークを焼いてみると、世界が変わります。', recommends: [
        ['ロー&スロー BBQとは何か', 'PHILOSOPHY', '../journal/articles/low-and-slow.html'],
        ['プルドポークの作り方', 'RECIPE', '../journal/articles/pulled-pork.html'],
        ['リバースシア法とは', 'SCIENCE', '../journal/articles/reverse-sear.html'],
      ]},
      {min: 40, max: 59, label: 'BBQマスター候補', deviation: 60, desc: '中級者として安定。次のステップはブリスケットの12時間ロー&スロー。中心温度ガイドとテキサスクラッチを学べば、本格派の仲間入りです。', recommends: [
        ['ブリスケットとは何か。12時間ロー&スロー', 'RECIPE', '../journal/articles/brisket.html'],
        ['テキサスクラッチとは', 'SCIENCE', '../journal/articles/texas-crutch.html'],
        ['BBQラブの選び方', 'GEAR', '../journal/articles/bbq-rub-osusume.html'],
      ]},
      {min: 60, max: 79, label: 'BBQ準ピットマスター', deviation: 67, desc: '相当の腕前。あとはバーンエンドやメイラード反応の科学を深掘りすれば、ピットマスター級。SLOW FIREのコンテンツも刺激になるはず。', recommends: [
        ['バーンエンドとは。テキサスBBQの肉キャンディ', 'PHILOSOPHY', '../journal/articles/burnt-ends.html'],
        ['メイラード反応とは', 'SCIENCE', '../journal/articles/maillard-reaction.html'],
        ['プライムリブの中心温度', 'SCIENCE', '../journal/articles/prime-rib-temperature.html'],
      ]},
      {min: 80, max: 100, label: 'BBQピットマスター', deviation: 75, desc: 'もはやプロ級。あなたの知識を誰かに伝える側に回るタイミングです。SLOW FIREのコミュニティで一緒に「BBQを日常にする」運動をやりませんか？', recommends: [
        ['BBQ場検索 — 24スポット完全比較', 'TOOL', '../bbq-spots/'],
        ['BBQ無料ツール3選', 'TOOL', '../tools/'],
        ['SLOW FIRE 私たちについて', 'ABOUT', '../team.html'],
      ]},
    ];

    let step = 0;
    let score = 0;

    function renderProgress() {
      const el = document.getElementById('qzProgress');
      el.innerHTML = QUESTIONS.map((_, i) => `<div class="qz-progress-bar ${i < step ? 'done' : i === step ? 'active' : ''}"></div>`).join('');
    }

    function renderQuestion() {
      if (step >= QUESTIONS.length) {
        renderResult();
        return;
      }
      renderProgress();
      const q = QUESTIONS[step];
      document.getElementById('qzQuestion').innerHTML = `
        <div class="qz-step-num">Q${step + 1} / ${QUESTIONS.length}</div>
        <h2 class="qz-question">${q.q}</h2>
        <div class="qz-options">
          <button class="qz-option" data-val="yes">✓ はい</button>
          <button class="qz-option" data-val="no">✕ いいえ</button>
        </div>
      `;
      document.querySelectorAll('.qz-option').forEach(b => {
        b.addEventListener('click', () => {
          score += q[b.dataset.val];
          step++;
          renderQuestion();
        });
      });
    }

    function renderResult() {
      document.getElementById('qzProgress').style.display = 'none';
      document.getElementById('qzQuestion').style.display = 'none';
      const lvl = LEVELS.find(l => score >= l.min && score <= l.max) || LEVELS[0];
      const result = document.getElementById('qzResult');
      result.classList.add('active');

      const text = `BBQ偏差値${lvl.deviation} — ${lvl.label}`;
      const shareText = `BBQ偏差値診断やってみた！\n→ ${text}\n\nあなたも診断してみる？\n${location.href}`;

      result.innerHTML = `
        <p class="qz-result-score">あなたのBBQ偏差値</p>
        <div class="qz-result-num">${lvl.deviation}</div>
        <h2 class="qz-result-label">${lvl.label}</h2>
        <p class="qz-result-desc">${lvl.desc}</p>

        <div class="qz-rec">
          <h3>あなたへのおすすめ</h3>
          <div class="qz-rec-list">
            ${lvl.recommends.map(([t, c, u]) => `
              <a href="${u}" class="qz-rec-card">
                <div class="qz-rec-cat">${c}</div>
                <div class="qz-rec-title">${t}</div>
              </a>
            `).join('')}
          </div>
        </div>

        <div class="qz-share-row">
          <a href="https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}" target="_blank" rel="noopener" class="qz-share-btn x">𝕏 で結果を共有</a>
          <a href="https://line.me/R/msg/text/?${encodeURIComponent(shareText)}" target="_blank" rel="noopener" class="qz-share-btn line">LINEで共有</a>
          <button class="qz-share-btn restart" onclick="location.reload()">もう一度やる</button>
        </div>
      `;

      // Save level
      try { localStorage.setItem('sf_level_deviation', lvl.deviation); } catch {}
    }

    renderQuestion();
  </script>
