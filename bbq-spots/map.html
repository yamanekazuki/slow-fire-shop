  <script>
    // Pre-computed lat/lng for each spot
    const COORDS = {
      'musashino-koen-bbq': [35.6914, 139.5070],
      'nogawa-koen-bbq': [35.6960, 139.5400],
      'komaba-no-koen-bbq': [35.6601, 139.6810],
      'jonanjima-kaihin-koen-bbq': [35.5876, 139.7765],
      'wakasu-kaihin-koen-camp': [35.6280, 139.8377],
      'hikarigaoka-koen-bbq': [35.7625, 139.6280],
      'showa-kinen-koen-bbq': [35.7065, 139.4060],
      'local-bbq-harumi': [35.6555, 139.7820],
      'hero-field-shinkiba': [35.6452, 139.8275],
      'kasai-rinkai-koen-bbq': [35.6398, 139.8597],
      'kinuta-koen-bbq': [35.6200, 139.6280],
      'akiruno-akiru-koen': [35.7280, 139.2920],
      'wild-magic-toyosu': [35.6470, 139.7950],
      'ogawamachi-bbq': [35.7110, 139.5070],
      'ojima-komatsugawa-koen-bbq': [35.6815, 139.8350],
      'yokohama-zou-no-hana': [35.4520, 139.6440],
      'umizuri-koen-yokohama': [35.4170, 139.6680],
      'shounan-enoshima-bbq': [35.3010, 139.4830],
      'inagekaihin-koen-chiba': [35.6450, 140.0440],
      'shinrin-koen-funabashi': [35.6720, 139.9810],
      'showanomori-noda': [35.9530, 139.8910],
      'akigase-saitama': [35.8470, 139.6160],
      'saiko-toda-saitama': [35.8120, 139.6810],
      'kawagoe-saitama-bbq': [35.9120, 139.4860],
    };

    const TYPE_COLOR = { A: '#9CA3AF', B: '#CA8A04', C: '#16A34A', D: '#B45309' };

    async function init() {
      const res = await fetch('data.json');
      const spots = await res.json();

      const map = L.map('map').setView([35.65, 139.7], 10);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap',
        maxZoom: 18,
      }).addTo(map);

      const group = L.featureGroup();
      spots.forEach(spot => {
        const c = COORDS[spot.slug];
        if (!c) return;
        const color = TYPE_COLOR[spot.slowFireType] || '#666';
        const icon = L.divIcon({
          className: 'mp-marker',
          html: `<div style="background:${color};width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid white;box-shadow:0 3px 6px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;"><span style="transform:rotate(45deg);color:white;font-size:11px;font-weight:900;">${spot.slowFireType}</span></div>`,
          iconSize: [28, 28],
          iconAnchor: [14, 28],
        });
        const m = L.marker(c, { icon }).addTo(map);
        m.bindPopup(`
          <div class="mp-popup-name">${spot.name}</div>
          <div class="mp-popup-meta">${spot.areaLabel} · ${spot.city}</div>
          <span class="mp-popup-tag">TYPE ${spot.slowFireType}</span>
          <span class="mp-popup-tag">★${spot.americanBbqRating}/5</span>
          <br>
          <a href="${spot.slug}.html" class="mp-popup-link">詳細を見る →</a>
        `);
        group.addLayer(m);
      });
      map.fitBounds(group.getBounds(), { padding: [30, 30] });
    }
    init();
  </script>
