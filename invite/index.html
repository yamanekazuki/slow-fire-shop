    .iv-wrap { max-width: 720px; margin: 0 auto; padding: calc(var(--nav-h) + 40px) 24px 64px; }

    /* Hero invitation card */
    .iv-card {
      background: linear-gradient(135deg, #1f1f1f, #3a2818);
      color: var(--white);
      border-radius: 20px;
      padding: 56px 32px;
      text-align: center;

      overflow: hidden;

    .iv-card::before {
      content: '';

      background-image: url('https://images.unsplash.com/photo-1621851709622-e19c9a4f0cc5?auto=format&fit=crop&w=1200&q=80');

    .iv-mark {

    .iv-subtitle {
      font-size: var(--text-base);
      color: rgba(255,255,255,0.7);
      margin-bottom: 36px;
      line-height: var(--leading-relaxed);
    }

    .iv-details {
      display: grid;
      gap: 14px;
      max-width: 380px;
      margin: 0 auto;
      text-align: left;
      background: rgba(255,255,255,0.06);
      padding: 24px;
      border-radius: 14px;
      backdrop-filter: blur(8px);
    }
    .iv-detail-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .iv-detail-row:last-child { border-bottom: none; }
    .iv-detail-label { font-size: 11px; letter-spacing: 0.06em; color: rgba(255,255,255,0.5); text-transform: uppercase; font-weight: var(--weight-bold); }
    .iv-detail-value { font-size: var(--text-base); color: var(--white); font-weight: var(--weight-semi); text-align: right; }

    .iv-message {
      max-width: 480px; margin: 36px auto 0;
      font-size: var(--text-md); line-height: var(--leading-relaxed);
      color: rgba(255,255,255,0.92);
    }

    .iv-actions { margin-top: 40px; }
    .iv-action-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 16px; }
    .iv-btn {
      padding: 12px 22px;
      border-radius: 100px; font-size: var(--text-sm); font-weight: var(--weight-bold);
      font-family: inherit; cursor: pointer; transition: all 0.15s;
      display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
      border: none;
    }
    .iv-btn-primary { background: var(--brand-500); color: var(--white); }
    .iv-btn-primary:hover { background: var(--brand-700); transform: translateY(-1px); }
    .iv-btn-line { background: #06C755; color: var(--white); }
    .iv-btn-line:hover { background: #04a346; }
    .iv-btn-ghost { background: rgba(255,255,255,0.1); color: var(--white); border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(6px); }
    .iv-btn-ghost:hover { background: rgba(255,255,255,0.15); }
    .iv-btn-dark { background: var(--white); color: var(--gray-900); }
    .iv-btn-dark:hover { background: var(--gray-100); }

    .iv-foot {
      text-align: center; margin-top: 32px;
      color: var(--gray-500); font-size: var(--text-sm);
    }
    .iv-foot a { color: var(--brand-500); text-decoration: none; font-weight: var(--weight-semi); }
    .iv-foot a:hover { text-decoration: underline; }

    /* Editor view (when no params) */
    .iv-editor { background: var(--white); border: 1px solid var(--gray-200); border-radius: 16px; padding: 32px; }
    .iv-editor h2 { font-size: var(--text-xl); font-weight: var(--weight-bold); margin-bottom: 18px; color: var(--gray-900); }
    .iv-form-row { margin-bottom: 16px; }
    .iv-label { display: block; font-size: var(--text-xs); font-weight: var(--weight-bold); color: var(--gray-700); margin-bottom: 6px; letter-spacing: 0.04em; }
    .iv-input { width: 100%; padding: 12px 14px; font-family: inherit; font-size: var(--text-base); border: 1.5px solid var(--gray-300); border-radius: 10px; outline: none; }
    .iv-input:focus { border-color: var(--brand-500); box-shadow: 0 0 0 3px rgba(180,83,9,.08); }

    .iv-copied { display: none; padding: 10px 16px; background: var(--success); color: var(--white); border-radius: 8px; font-size: var(--text-sm); font-weight: var(--weight-semi); margin-top: 8px; text-align: center; }
    .iv-copied.show { display: block; }

    @media (max-width: 640px) {
      .iv-card { padding: 36px 20px; }
      .iv-action-row { flex-direction: column; }
      .iv-btn { width: 100%; justify-content: center; }

  <script>
    // ===== 招待状ジェネレーター =====
    const params = new URLSearchParams(location.search);
    const container = document.getElementById('ivContainer');

    function escapeHtml(s) {
      return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
    }

    if (params.has('date')) {
      // === 招待状ビュー ===
      const date = params.get('date');
      const people = params.get('people') || '?';
      const style = params.get('style') || 'mix';
      const area = params.get('area') || 'any';
      const spot = params.get('spot') || '';
      const host = params.get('host') || '';
      const message = params.get('msg') || '';
      const time = params.get('time') || '10:30〜15:30';

      const styleLabel = {yakiniku:'焼肉スタイル', authentic:'アメリカンBBQ', mix:'ミックス'}[style] || style;
      const dateObj = new Date(date);
      const dateStr = dateObj.toLocaleDateString('ja-JP', { year:'numeric', month:'long', day:'numeric', weekday:'short' });

      // Calendar / LINE URLs
      const [startTime, endTime] = (time.includes('〜') ? time.split('〜') : ['10:30', '15:30']);
      const eventStart = new Date(date + 'T' + startTime + ':00');
      const eventEnd = new Date(date + 'T' + endTime + ':00');
      const fmt = d => d.toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';
      const gcalUrl = 'https://www.google.com/calendar/render?action=TEMPLATE&' + new URLSearchParams({
        text: `BBQ — ${people}人 / ${styleLabel}`,
        dates: `${fmt(eventStart)}/${fmt(eventEnd)}`,
        details: `SLOW FIREで作った招待状\n${spot || ''}\n${message || ''}\n\n招待状: ${location.href}`,
        location: spot || '',
      });

      const lineText = `BBQやりませんか？\n📅 ${dateStr}\n⏰ ${time}\n👥 ${people}人\n${spot ? '📍 ' + spot + '\n' : ''}\n招待状: ${location.href}`;
      const lineUrl = 'https://line.me/R/msg/text/?' + encodeURIComponent(lineText);

      container.innerHTML = `
        <div class="iv-card">
          <p class="iv-mark">BBQ INVITATION</p>
          <h1 class="iv-title">${host ? escapeHtml(host) + 'からの招待' : 'BBQに招待されました'}</h1>
          <p class="iv-subtitle">火と、肉と、時間と、人と。<br>${escapeHtml(dateStr)} の半日、ご一緒できれば。</p>

          <div class="iv-details">
            <div class="iv-detail-row">
              <span class="iv-detail-label">日時</span>
              <span class="iv-detail-value">${escapeHtml(dateStr)}<br><span style="font-size:12px;opacity:0.7;">${escapeHtml(time)}</span></span>
            </div>
            ${spot ? `<div class="iv-detail-row"><span class="iv-detail-label">場所</span><span class="iv-detail-value">${escapeHtml(spot)}</span></div>` : ''}
            <div class="iv-detail-row"><span class="iv-detail-label">人数</span><span class="iv-detail-value">${escapeHtml(people)}人</span></div>
            <div class="iv-detail-row"><span class="iv-detail-label">スタイル</span><span class="iv-detail-value">${escapeHtml(styleLabel)}</span></div>
          </div>

          ${message ? `<p class="iv-message">${escapeHtml(message).replace(/\n/g, '<br>')}</p>` : `<p class="iv-message">特別な準備は必要ありません。手ぶらでもOK。<br>一緒に半日、ゆっくり過ごせれば嬉しいです。</p>`}

          <div class="iv-actions">
            <div class="iv-action-row">
              <a href="${gcalUrl}" target="_blank" rel="noopener" class="iv-btn iv-btn-primary">📅 カレンダーに追加</a>
              <a href="${lineUrl}" target="_blank" rel="noopener" class="iv-btn iv-btn-line">💬 LINEで返信</a>
            </div>
            <div class="iv-action-row">
              <button class="iv-btn iv-btn-ghost" onclick="navigator.clipboard.writeText(location.href).then(()=>{document.getElementById('copied').classList.add('show');setTimeout(()=>document.getElementById('copied').classList.remove('show'),2000)})">🔗 招待URLをコピー</button>
              <a href="../planner/" class="iv-btn iv-btn-ghost">🛠 自分も計画する</a>
            </div>
            <div class="iv-copied" id="copied">✓ URLをコピーしました</div>
          </div>
        </div>

        <div class="iv-foot">
          <p>この招待状は <a href="../planner/">SLOW FIREのBBQプランナー</a> で作成されました。<br>
          あなたも次のBBQを5分で計画できます。</p>
        </div>
      `;
    } else {
      // === エディタビュー（新規作成） ===
      container.innerHTML = `
        <div class="iv-editor">
          <h2>📨 招待状を作る</h2>
          <p style="font-size:var(--text-sm);color:var(--gray-600);margin-bottom:24px;">最低限「日時・人数・場所」を入れれば、共有可能な招待状URLが生成されます。</p>

          <div class="iv-form-row">
            <label class="iv-label" for="ivHost">ホスト名（任意）</label>
            <input id="ivHost" class="iv-input" placeholder="例: 山根">
          </div>

          <div class="iv-form-row">
            <label class="iv-label" for="ivDate">日付 *</label>
            <input id="ivDate" type="date" class="iv-input" required>
          </div>

          <div class="iv-form-row">
            <label class="iv-label" for="ivTime">時間</label>
            <input id="ivTime" class="iv-input" placeholder="10:30〜15:30" value="10:30〜15:30">
          </div>

          <div class="iv-form-row">
            <label class="iv-label" for="ivPeople">人数</label>
            <input id="ivPeople" type="number" class="iv-input" placeholder="4" value="4" min="2" max="50">
          </div>

          <div class="iv-form-row">
            <label class="iv-label" for="ivSpot">場所</label>
            <input id="ivSpot" class="iv-input" placeholder="例: 武蔵野公園バーベキュー広場">
          </div>

          <div class="iv-form-row">
            <label class="iv-label" for="ivStyle">スタイル</label>
            <select id="ivStyle" class="iv-input">
              <option value="mix">ミックス</option>
              <option value="yakiniku">焼肉スタイル</option>
              <option value="authentic">アメリカンBBQ</option>
            </select>
          </div>

          <div class="iv-form-row">
            <label class="iv-label" for="ivMsg">メッセージ（任意）</label>
            <textarea id="ivMsg" class="iv-input" rows="4" placeholder="例: 久しぶりに集まりませんか。火を囲んで半日、ご一緒できれば嬉しいです。"></textarea>
          </div>

          <button id="ivGenBtn" class="iv-btn iv-btn-primary" style="background:var(--brand-500);color:white;padding:14px 28px;width:100%;border-radius:10px;font-weight:700;cursor:pointer;border:none;font-family:inherit;font-size:16px;">📨 招待状を生成する</button>
        </div>
      `;

      // Default date: next Saturday
      const nextSat = new Date();
      nextSat.setDate(nextSat.getDate() + ((6 - nextSat.getDay() + 7) % 7 || 7));
      document.getElementById('ivDate').value = nextSat.toISOString().split('T')[0];

      document.getElementById('ivGenBtn').addEventListener('click', () => {
        const p = new URLSearchParams();
        const date = document.getElementById('ivDate').value;
        if (!date) { alert('日付を選んでください'); return; }
        p.set('date', date);
        p.set('people', document.getElementById('ivPeople').value || '4');
        p.set('style', document.getElementById('ivStyle').value);
        p.set('time', document.getElementById('ivTime').value || '10:30〜15:30');
        const host = document.getElementById('ivHost').value;
        if (host) p.set('host', host);
        const spot = document.getElementById('ivSpot').value;
        if (spot) p.set('spot', spot);
        const msg = document.getElementById('ivMsg').value;
        if (msg) p.set('msg', msg);
        location.href = '?' + p.toString();
      });
    }
  </script>
