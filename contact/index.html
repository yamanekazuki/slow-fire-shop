    .ct-input:focus, .ct-select:focus, .ct-textarea:focus { border-color: var(--brand-500); box-shadow: 0 0 0 3px rgba(180,83,9,.08); }
    .ct-textarea { min-height: 140px; resize: vertical; }
    .ct-btn { display: block; width: 100%; padding: 14px; background: var(--brand-500); color: var(--white); border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; transition: background 0.15s; font-family: inherit; }

  <main class="ct-wrap">
    <p class="ct-mark">CONTACT</p>
    <h1 class="ct-title">お問い合わせ</h1>
    <p class="ct-tagline">取材・パートナーシップ・出店相談・商品お問い合わせなど、<br>お気軽にご連絡ください。3営業日以内にお返事します。</p>

    <div class="ct-card">
      <form id="ctForm" action="https://formspree.io/f/your_form_id" method="POST">
        <div class="ct-row">
          <label class="ct-label" for="ctType">お問い合わせ種別 *</label>
          <select id="ctType" name="type" class="ct-select" required>
            <option value="">選択してください</option>
            <option>一般のお問い合わせ</option>
            <option>取材・メディア掲載依頼</option>
            <option>パートナーシップ・コラボ</option>
            <option>BBQイベント出店・運営相談</option>
            <option>BBQ場の情報追加・修正リクエスト</option>
            <option>商品・購入について</option>
            <option>その他</option>
          </select>
        </div>

        <div class="ct-row">
          <label class="ct-label" for="ctName">お名前 *</label>
          <input id="ctName" name="name" class="ct-input" required>
        </div>

        <div class="ct-row">
          <label class="ct-label" for="ctEmail">メールアドレス *</label>
          <input id="ctEmail" name="email" type="email" class="ct-input" required>
        </div>

        <div class="ct-row">
          <label class="ct-label" for="ctOrg">会社・組織名（任意）</label>
          <input id="ctOrg" name="organization" class="ct-input">
        </div>

        <div class="ct-row">
          <label class="ct-label" for="ctMsg">メッセージ *</label>
          <textarea id="ctMsg" name="message" class="ct-textarea" required placeholder="ご用件を詳しくお書きください。"></textarea>
        </div>

        <input type="hidden" name="_subject" value="SLOW FIRE お問い合わせ">
        <button type="submit" class="ct-btn">送信する</button>
        <div class="ct-success" id="ctSuccess">✓ 送信しました。3営業日以内にお返事します。</div>
      </form>
    </div>

    <div class="ct-direct">
      <strong>メールで直接ご連絡</strong><br>
      <a href="mailto:yamane@potentialight.com">yamane@potentialight.com</a><br>
      <span style="font-size:11.5px;color:var(--gray-500);">フォームの代わりにメールでも構いません</span>
    </div>
  </main>

  <script>
    document.getElementById('ctForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const form = e.target;
      fetch(form.action, { method: 'POST', body: new FormData(form), headers: { 'Accept': 'application/json' } })
        .then(r => { if (r.ok) { document.getElementById('ctSuccess').classList.add('show'); form.reset(); } else alert('送信に失敗しました'); })
        .catch(() => alert('送信に失敗しました'));
    });
  </script>
